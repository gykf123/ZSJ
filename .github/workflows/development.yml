name: Development build

on:
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

jobs:
  build:
    name: Development build (iOS)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          brew install make cmake openjdk@17 || true
          # ldid：iOS 自签工具（无需 Apple 开发者证书）。优先用预编译二进制。
          if ! command -v ldid >/dev/null 2>&1; then
            curl -fsSL "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_x86_64" -o /usr/local/bin/ldid 2>/dev/null \
            || curl -fsSL "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64" -o /usr/local/bin/ldid 2>/dev/null \
            || true
            chmod +x /usr/local/bin/ldid 2>/dev/null || true
          fi
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Build for iOS
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export JAVA_HOME="$(brew --prefix openjdk@17 2>/dev/null || /usr/libexec/java_home -v 17 || "")"
          export SLIMMED=1
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2 TROLLSTORE_JIT_ENT=1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amethyst-ios
          path: |
            artifacts/**/*.ipa
            artifacts/**/*.tipa
            artifacts/**/*.dSYM
