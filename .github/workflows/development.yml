name: Development build

on:
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

jobs:
  build:
    name: Development build (iOS)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          set -e
          brew install make cmake openjdk@8 openjdk@17 wget ldid
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Get JRE8
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: depends
          workflow_conclusion: success
          allow_forks: false
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre8
          name: jre8-ios-aarch64

      - name: Get JRE17
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: depends
          workflow_conclusion: completed
          allow_forks: false
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre17-ios-aarch64

      - name: Get JRE21
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: depends
          workflow_conclusion: completed
          allow_forks: false
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre21-ios-aarch64

      - name: Build for iOS
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export RUNNER=1 SLIMMED=1
          export BOOTJDK="$(brew --prefix openjdk@8)/libexec/openjdk.jdk/Contents/Home/bin"
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2 TROLLSTORE_JIT_ENT=1

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-ios-ipa
          path: artifacts/org.angelauramc.amethyst*ios.ipa
          if-no-files-found: error

      - name: Upload trollstore tipa
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-ios-trollstore-tipa
          path: artifacts/*trollstore.tipa
          if-no-files-found: error

      - name: Upload dSYM
        uses: actions/upload-artifact@v4
        with:
          name: amethyst-ios-dsym
          path: artifacts/*.dSYM
          if-no-files-found: ignore
