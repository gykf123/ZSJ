name: Development build

on:
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Development build (iOS)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools (brew)
        run: |
          brew install make cmake wget openjdk@8 || true
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Set BOOTJDK (JDK 8)
        run: |
          PREFIX="$(brew --prefix openjdk@8 2>/dev/null)"
          if [ -x "$PREFIX/libexec/openjdk.jdk/Contents/Home/bin/javac" ]; then
            echo "BOOTJDK=$PREFIX/libexec/openjdk.jdk/Contents/Home/bin" >> "$GITHUB_ENV"
          else
            echo "::error::openjdk@8 not found at $PREFIX"; exit 1
          fi
          "$BOOTJDK"/javac -version

      - name: Install ldid (procursus)
        run: |
          curl -fsSL "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_arm64" -o /usr/local/bin/ldid \
            || curl -fsSL "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macosx_x86_64" -o /usr/local/bin/ldid
          chmod +x /usr/local/bin/ldid
          /usr/local/bin/ldid -h || true

      - name: Verify toolchain
        run: |
          which gmake cmake wget ldid
          xcrun --sdk iphoneos --show-sdk-path
          /opt/jdk8/bin/javac -version

      - name: Get JRE8
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: depends
          workflow_conclusion: success
          allow_forks: false
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre8
          name: jre8-ios-aarch64

      - name: Get JRE17
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: depends
          workflow_conclusion: completed
          allow_forks: false
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre17-ios-aarch64

      - name: Get JRE21
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build.yml
          path: depends
          workflow_conclusion: completed
          allow_forks: false
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17-21
          name: jre21-ios-aarch64

      - name: Build for iOS
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          export RUNNER=1 SLIMMED=1
          export BOOTJDK="${{ env.BOOTJDK }}"
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=2 TROLLSTORE_JIT_ENT=1

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            --prerelease \
            --title "CI Build #${{ github.run_number }}" \
            --notes "Automated build of Angel Aura Amethyst (no-account download patch)." \
            artifacts/org.angelauramc.amethyst*ios.ipa \
            artifacts/*trollstore.tipa || true

      - name: Upload artifacts (fallback)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amethyst-ios
          path: |
            artifacts/**/*.ipa
            artifacts/**/*.tipa
            artifacts/**/*.dSYM
