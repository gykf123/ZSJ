name: Development build

on:
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Development build (iOS)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools (brew + GNU make)
        run: |
          {
          set +e
          brew update >/dev/null 2>&1
          echo "BREW_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"
          # 注意: Homebrew 的 GNU make 包名是 make, 装出来叫 gmake 且刻意不链接进 bin
          for p in make cmake wget coreutils; do
            brew install "$p" 2>&1 | tail -3 || brew upgrade "$p" 2>&1 | tail -3 || echo "brew pkg $p FAILED"
          done
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          GM=""
          for c in "$(brew --prefix make 2>/dev/null)/bin/gmake" \
                   "$(brew --prefix)/opt/make/bin/gmake" \
                   "$(brew --prefix)/bin/gmake" \
                   "$(command -v gmake 2>/dev/null)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then GM="$c"; break; fi
          done
          if [ -z "$GM" ]; then
            GM="$(find "$(brew --prefix)" -maxdepth 4 -type f -name gmake -perm -u+x 2>/dev/null | head -1)"
          fi
          if [ -z "$GM" ]; then
            echo "=> GNU make not found via brew, compiling from source"
            cd /tmp && rm -rf mk && mkdir mk && cd mk
            wget -q https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz \
              && tar xzf make-4.4.1.tar.gz && cd make-4.4.1 \
              && ./configure --prefix="$HOME/gnu" --disable-dependency-tracking >/dev/null 2>&1 \
              && make -j"$(sysctl -n hw.ncpu)" >/dev/null 2>&1 \
              && make install >/dev/null 2>&1
            [ -x "$HOME/gnu/bin/make" ] && GM="$HOME/gnu/bin/make"
          fi
          echo "GMAKE=$GM" >> "$GITHUB_ENV"
          echo "=> GMAKE=$GM"
          if [ -n "$GM" ] && [ -x "$GM" ]; then "$GM" --version | head -1; else echo "::error::GNU make unavailable"; fi
          export PATH="$(brew --prefix)/bin:$PATH"
          cmake --version | head -1
          wget --version | head -1
          } 2>&1 | tee "$RUNNER_TEMP/brew.log"

      - name: Install JDK 8 (BOOTJDK)
        run: |
          {
          set +e
          try_jdk() {
            url="$1"
            echo "------ try: $url"
            rm -f /tmp/jdk8.tar.gz
            curl -L --retry 3 --connect-timeout 30 --max-time 1800 \
                 -w "\nHTTP=%{http_code} SIZE=%{size_download}\n" \
                 "$url" -o /tmp/jdk8.tar.gz
            if [ ! -s /tmp/jdk8.tar.gz ]; then echo "=> download failed/empty"; return 1; fi
            ls -l /tmp/jdk8.tar.gz
            JDKHOME="$HOME/jdk8"
            rm -rf "$JDKHOME"; mkdir -p "$JDKHOME"
            tar xzf /tmp/jdk8.tar.gz -C "$JDKHOME" --strip-components=1 || tar xzf /tmp/jdk8.tar.gz -C "$JDKHOME" || return 1
            JC="$(find "$JDKHOME" -type f -name javac -perm -u+x 2>/dev/null | head -1)"
            echo "=> found javac: ${JC:-NONE}"
            if [ -n "$JC" ] && "$JC" -version 2>&1 | grep -q '1\.8'; then
              export BOOTJDK="$(dirname "$JC")"
              echo "BOOTJDK=$BOOTJDK" >> "$GITHUB_ENV"
              echo "=> OK"; "$JC" -version; return 0
            fi
            echo "=> javac missing or not 1.8"; return 1
          }
          try_jdk "https://github.com/Tencent/TencentKona-8/releases/download/8.0.27-GA/TencentKona8.0.27.b1_jdk_macosx-aarch64_8u502_notarized.tar.gz" \
            || try_jdk "https://cdn.azul.com/zulu/bin/zulu8.96.0.205-ca-jdk8.0.504-macosx_aarch64.tar.gz" \
            || try_jdk "https://cdn.azul.com/zulu/bin/zulu8.94.0.17-ca-jdk8.0.492-macosx_aarch64.tar.gz" \
            || { echo "=> fall back to brew"; brew install openjdk@8 2>&1 | tail -5; }
          set -e
          if [ -z "$BOOTJDK" ]; then
            echo "::error::JDK8 unavailable"
          else
            "$BOOTJDK/javac" -version
          fi
          } 2>&1 | tee "$RUNNER_TEMP/jdk.log"

      - name: Ensure ldid
        run: |
          set +e
          if command -v ldid >/dev/null 2>&1; then echo "ldid already present"; command -v ldid; exit 0; fi
          for a in ldid_macosx_arm64 ldid_macosx_universal ldid_macosx_x86_64; do
            if curl -fsSL "https://github.com/ProcursusTeam/ldid/releases/latest/download/$a" -o /tmp/ldidbin; then
              install -m755 /tmp/ldidbin /usr/local/bin/ldid && echo "installed $a" && break
            fi
          done
          command -v ldid || { echo "::error::ldid could not be installed"; exit 1; }

      - name: Verify toolchain
        run: |
          set +e
          BOOTJDK="${BOOTJDK:-$HOME/jdk8/bin}"
          {
            echo "=== date ==="; date
            echo "=== os ==="; sw_vers
            echo "=== tools ==="
            for t in gmake make cmake wget ldid xcrun zip; do
              printf "%-8s -> %s\n" "$t" "$(command -v "$t" 2>/dev/null || echo MISSING)"
            done
            echo "=== javac ==="; "$BOOTJDK/javac" -version 2>&1
            echo "=== sdk ==="; xcrun --sdk iphoneos --show-sdk-path 2>&1
            echo "=== xcode ==="; xcodebuild -version 2>&1
            echo "=== depends ==="; ls -la depends 2>&1 | head -20
          } 2>&1 | tee "$RUNNER_TEMP/toolchain.log"

      - name: Build for iOS
        run: |
          set -o pipefail
          export PATH="/opt/homebrew/bin:/usr/local/bin:${BREW_PREFIX:-/opt/homebrew}/bin:$PATH"
          export BOOTJDK="${BOOTJDK:-$HOME/jdk8/bin}"
          export SDKPATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          export RUNNER=0
          export PLATFORM=2
          export SLIMMED=0
          mkdir -p depends artifacts
          GS="${GMAKE:-$(command -v gmake)}"
          echo "BOOTJDK=$BOOTJDK  SDKPATH=$SDKPATH  GMAKE=$GS"
          "$GS" -j"$(sysctl -n hw.ncpu)" package PLATFORM=2 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Publish diagnostics (public release notes)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          D="$RUNNER_TEMP/diag_part.txt"
          {
            echo "=== BREW LOG ==="; cat "$RUNNER_TEMP/brew.log" 2>/dev/null
            echo "=== JDK INSTALL LOG ==="; tail -n 30 "$RUNNER_TEMP/jdk.log" 2>/dev/null
            echo "=== TOOLCHAIN ==="; cat "$RUNNER_TEMP/toolchain.log" 2>/dev/null
            echo "=== ARTIFACTS ==="; find artifacts -maxdepth 2 2>/dev/null | head -40
            echo "=== DEPENDS ==="; ls -la depends 2>/dev/null | head -30
            echo "=== BUILD LOG HEAD ==="; head -n 120 "$RUNNER_TEMP/build.log" 2>/dev/null
            echo "=== BUILD LOG TAIL ==="; tail -n 250 "$RUNNER_TEMP/build.log" 2>/dev/null
          } > "$D" 2>&1
          tail -c 40000 "$D" > "$RUNNER_TEMP/notes.md"
          gh release delete diag-latest --cleanup-tag -y >/dev/null 2>&1
          gh release create diag-latest \
            --title "diag run ${{ github.run_number }}" \
            --notes-file "$RUNNER_TEMP/notes.md" >/dev/null 2>&1
          echo "diag published"

      - name: Publish IPA release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la artifacts/
          gh release create "build-${{ github.run_number }}" \
            --latest \
            --title "Amethyst IPA (无账号即可下载版本) #${{ github.run_number }}" \
            --notes "自动构建：已移除强制正版账号才能下载游戏版本的限制。" \
            artifacts/*.ipa

      - name: Upload artifacts (fallback)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amethyst-ios
          retention-days: 7
          path: |
            artifacts/**/*.ipa
